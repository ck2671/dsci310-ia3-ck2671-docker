name: Docker Image CI

on:
  push:
    branches: [main]  # Runs the workflow when code is pushed to the main branch
  workflow_dispatch:   # Allows manual triggering from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest  # The workflow will run on the latest Ubuntu GitHub Actions runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3  # Checks out the repository code so the workflow can use it

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-${{ github.actor }}-docker:latest .

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-${{ github.actor }}-docker:latest

